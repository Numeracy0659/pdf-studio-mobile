name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Verify 32-bit and 64-bit ARM support
        working-directory: android
        run: |
          for ABI in armeabi-v7a arm64-v8a; do
            if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/${ABI}/"; then
              echo "Missing ${ABI} native libraries from the APK."
              exit 1
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
